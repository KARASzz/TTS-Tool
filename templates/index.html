<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多引擎语音合成</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#282522;background:#f7f4ee}body{max-width:1080px;margin:0 auto;padding:36px 20px}h1{font-size:30px;margin:0 0 8px}.sub{color:#756e65;margin-bottom:24px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:#fff;border:1px solid #e6ded3;border-radius:18px;padding:22px;box-shadow:0 8px 28px #5b49340d}label{display:block;font-weight:600;margin:15px 0 7px}select,textarea,input{box-sizing:border-box;width:100%;border:1px solid #d8cec1;border-radius:10px;padding:11px;font:inherit;background:#fff}textarea{min-height:240px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{margin-top:20px;background:#d96838;color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.hint{color:#867b70;font-size:13px;line-height:1.6}.status{min-height:32px;color:#766b60;margin:14px 0}.result audio{width:100%;margin:18px 0}.result a{display:inline-block;color:#c45129;font-weight:600}.badge{display:inline-block;background:#f2e6d8;color:#a6502f;border-radius:99px;padding:5px 10px;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><h1>多引擎语音合成</h1><div class="sub">MiMo、火山方舟、MiniMax 订阅统一入口 <span class="badge">本地运行</span></div><div class="grid"><section class="card"><form id="form"><label>服务商</label><select name="provider" id="provider"><option value="mimo">小米 MiMo · mimo-v2.5-tts</option><option value="volc">火山方舟订阅 · 豆包语音合成 2.0</option><option value="minimax">MiniMax 订阅 · speech-2.8-hd</option></select><div class="row"><div><label>音色 ID</label><select name="voice" id="voice"></select></div><div><label>音频样本（可选）</label><input name="sample" type="file" accept=".wav,.mp3"></div></div><label>待合成文本</label><textarea name="text" required placeholder="输入要朗读的文字……"></textarea><label>风格/导演指令（可选）</label><input name="style" placeholder="例如：温柔、语速稍慢，像深夜电台主持人"><button id="submit">生成语音</button></form><div class="status" id="status"></div></section><section class="card result"><h2>生成结果</h2><p class="hint">生成的音频文件会保存在项目的 outputs/ 目录。长文本会自动按段落拆分后合成。</p><div id="result"><p class="hint">尚未生成音频。</p></div></section></div><script>
const form=document.querySelector('#form'),provider=document.querySelector('#provider'),voice=document.querySelector('#voice'),status=document.querySelector('#status'),submit=document.querySelector('#submit');async function loadVoices(){const all=await (await fetch('/api/voices')).json();voice.innerHTML=(all[provider.value]||[]).map(v=>`<option value="${v.id}">${v.name} · ${v.id}</option>`).join('')} provider.onchange=loadVoices; loadVoices();form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;status.textContent='正在合成，请稍候…';try{const r=await fetch('/api/tts',{method:'POST',body:new FormData(form)}),d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');document.querySelector('#result').innerHTML=`<audio controls src="${d.url}"></audio><br><a href="${d.url}" download="${d.filename}">下载 MP3</a><p class="hint">已生成 ${d.parts} 个文本片段。</p>`;status.textContent='合成完成。'}catch(err){status.textContent='失败：'+err.message}finally{submit.disabled=false}};
</script></body></html>
