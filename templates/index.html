<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>-TTS-Tool-</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#282522;background:#f7f4ee}body{position:relative;max-width:1080px;margin:0 auto;padding:36px 20px;isolation:isolate}body:before,body:after{content:"";position:fixed;z-index:-2;top:0;bottom:0;width:min(42vw,620px);background-repeat:no-repeat;background-size:auto 100%;background-position:center bottom;opacity:1;pointer-events:none}body:before{left:0;background-image:url("/assets/left-character.png")}body:after{right:0;background-image:url("/assets/right-character.png")}body:after,body:before{filter:saturate(.82)}body{background-color:#eee8df;background-image:radial-gradient(ellipse at center,rgba(255,253,248,.42) 0 30%,transparent 58%),repeating-linear-gradient(135deg,rgba(105,73,55,.12) 0 1px,transparent 1px 9px),repeating-linear-gradient(45deg,rgba(255,255,255,.20) 0 2px,transparent 2px 11px),radial-gradient(ellipse at 50% 20%,rgba(126,92,70,.16),transparent 60%)}h1{font-size:30px;margin:0 0 5px;letter-spacing:3px}.brand{display:flex;align-items:center;justify-content:center;gap:28px;text-align:center;margin-bottom:24px}.brand .sub{margin:0;color:#756e65;letter-spacing:4px}.scroll{position:relative;flex:1;max-width:min(38vw,520px);height:34px;font-size:0;border-top:2px solid rgba(157,112,75,.62);border-bottom:1px solid rgba(157,112,75,.35);background:radial-gradient(ellipse at 8% 50%,transparent 0 7px,rgba(157,112,75,.62) 8px 10px,transparent 11px),radial-gradient(ellipse at 18% 50%,transparent 0 13px,rgba(157,112,75,.38) 14px 16px,transparent 17px),repeating-linear-gradient(155deg,transparent 0 18px,rgba(157,112,75,.42) 19px 21px,transparent 22px 38px);opacity:.9}.scroll:after{content:"❧";position:absolute;top:-22px;right:2px;font-size:42px;color:#9d704b;text-shadow:1px 1px 0 #f8f3eb,-2px 2px 0 rgba(94,61,42,.18)}.scroll.flip{transform:scaleX(-1)}.sub{color:#756e65;margin-bottom:24px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{position:relative;z-index:1;background:rgba(255,255,255,.94);border:1px solid #e6ded3;border-radius:18px;padding:22px;box-shadow:0 8px 28px #5b49340d}label{display:block;font-weight:600;margin:15px 0 7px}select,textarea,input{box-sizing:border-box;width:100%;border:1px solid #d8cec1;border-radius:10px;padding:11px;font:inherit;background:#fff}textarea{min-height:240px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{margin-top:20px;background:#d96838;color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.hint{color:#867b70;font-size:13px;line-height:1.6}.status{min-height:32px;color:#766b60;margin:14px 0}.result audio{width:100%;margin:18px 0}.result a{display:inline-block;color:#c45129;font-weight:600}.badge{display:inline-block;background:#f2e6d8;color:#a6502f;border-radius:99px;padding:5px 10px;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="brand"><span class="scroll">❧</span><div><h1>-TTS-Tool-</h1><div class="sub">KARAS-出品</div></div><span class="scroll flip">❧</span></div><div class="grid"><section class="card"><form id="form"><label>服务商</label><select name="provider" id="provider"><option value="mimo">小米 MiMo · mimo-v2.5-tts</option><option value="volc">火山方舟订阅 · 豆包语音合成 2.0</option><option value="minimax">MiniMax 订阅 · speech-2.8-hd</option></select><div class="row"><div><label>音色 ID</label><select name="voice" id="voice"></select></div><div><label>音频样本（可选）</label><input name="sample" type="file" accept=".wav,.mp3"></div></div><label>待合成文本</label><textarea name="text" required placeholder="输入要朗读的文字……"></textarea><label>风格/导演指令（可选）</label><input name="style" placeholder="例如：温柔、语速稍慢，像深夜电台主持人"><button id="submit">生成语音</button></form><div class="status" id="status"></div></section><section class="card result"><h2>生成结果</h2><p class="hint">生成的音频文件会保存在项目的 outputs/ 目录。长文本会自动按段落拆分后合成。</p><div id="result"><p class="hint">尚未生成音频。</p></div></section></div><script>
const form=document.querySelector('#form'),provider=document.querySelector('#provider'),voice=document.querySelector('#voice'),status=document.querySelector('#status'),submit=document.querySelector('#submit');async function loadVoices(){const all=await (await fetch('/api/voices')).json();voice.innerHTML=(all[provider.value]||[]).map(v=>`<option value="${v.id}">${v.name} · ${v.id}</option>`).join('')} provider.onchange=loadVoices; loadVoices();form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;status.textContent='正在合成，请稍候…';try{const r=await fetch('/api/tts',{method:'POST',body:new FormData(form)}),d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');document.querySelector('#result').innerHTML=`<audio controls src="${d.url}"></audio><br><a href="${d.url}" download="${d.filename}">下载 MP3</a><p class="hint">已生成 ${d.parts} 个文本片段。</p>`;status.textContent='合成完成。'}catch(err){status.textContent='失败：'+err.message}finally{submit.disabled=false}};
</script></body></html>
